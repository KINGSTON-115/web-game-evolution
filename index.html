<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>方块吞噬者 - 修复版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #1a1a2e; 
            overflow: hidden; 
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: none;
        }
        #gameCanvas { 
            display: block; 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); 
        }
        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(26, 26, 46, 0.95);
            z-index: 10;
        }
        .hidden { display: none !important; }
        h1 { font-size: clamp(32px, 8vw, 64px); color: #fff; margin-bottom: 20px; text-shadow: 0 0 30px rgba(255, 107, 107, 0.5); }
        .subtitle { color: #888; margin-bottom: 30px; font-size: 18px; }
        .btn {
            padding: 20px 60px;
            font-size: clamp(18px, 4vw, 24px);
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border: none;
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(255, 107, 107, 0.4);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-purple { background: linear-gradient(135deg, #6c5ce7, #a29bfe); box-shadow: 0 10px 40px rgba(108, 92, 231, 0.4); }
        #hud {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            z-index: 5;
        }
        .score-row { display: flex; justify-content: space-between; gap: 15px; }
        .score-box {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex: 1;
        }
        .score-label { color: #888; font-size: 14px; }
        .score-value { color: #fff; font-size: 24px; font-weight: bold; }
        #gameOverScreen h2 { color: #ff6b6b; font-size: 48px; margin-bottom: 20px; }
        #finalScore { color: #fff; font-size: 32px; margin-bottom: 30px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <!-- 开始界面 -->
    <div id="startScreen" class="screen">
        <h1>方块吞噬者</h1>
        <p class="subtitle">吃掉绿色小球，躲避红色大球！</p>
        <button id="startBtn" class="btn">▶ 开始游戏</button>
    </div>
    
    <!-- 游戏界面 -->
    <div id="hud">
        <div class="score-row">
            <div class="score-box">
                <div class="score-label">分数</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">最高分</div>
                <div class="score-value" id="highScore">0</div>
            </div>
        </div>
    </div>
    
    <!-- 游戏结束界面 -->
    <div id="gameOverScreen" class="screen hidden">
        <h2>游戏结束</h2>
        <div id="finalScore">得分: 0</div>
        <button id="restartBtn" class="btn btn-purple">再来一局</button>
    </div>

    <script>
        // ========== 游戏核心 ==========
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 自适应画布
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        
        // 游戏状态
        let gameState = 'start';
        let score = 0;
        let highScore = parseInt(localStorage.getItem('blockEater_highScore')) || 0;
        let animationId = null;
        
        // 玩家
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 20,
            baseSize: 20,
            color: '#ff6b6b',
            targetX: canvas.width / 2,
            targetY: canvas.height / 2,
            speed: 8
        };
        
        // 敌人列表
        let enemies = [];
        
        // 粒子列表
        let particles = [];
        
        // 分数弹出列表
        let scorePopups = [];
        
        // 更新高分显示
        document.getElementById('highScore').textContent = highScore;
        
        // 生成敌人
        function spawnEnemy() {
            const size = 15 + Math.random() * 35;
            const isDangerous = size > player.size;
            
            // 从屏幕边缘随机位置生成
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -size : canvas.width + size;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? -size : canvas.height + size;
            }
            
            // 随机移动方向
            const angle = Math.random() * Math.PI * 2;
            const speed = 1.5 + Math.random() * 2;
            
            enemies.push({
                x: x,
                y: y,
                size: size,
                color: isDangerous ? '#ee5a24' : '#4ade80',
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                speed: speed
            });
        }
        
        // 粒子效果
        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 4;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: 2 + Math.random() * 4,
                    color: color,
                    life: 1
                });
            }
        }
        
        // 分数弹出
        function createScorePopup(x, y, value) {
            scorePopups.push({
                x: x, y: y,
                value: '+' + value,
                life: 1,
                vy: -2
            });
        }
        
        // 生成初始敌人
        function spawnInitialEnemies() {
            for (let i = 0; i < 8; i++) {
                spawnEnemy();
            }
        }
        
        // 游戏循环
        let lastTime = 0;
        let spawnTimer = 0;
        
        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime || 16;
            lastTime = timestamp;
            
            // 清空画布
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景渐变
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (gameState !== 'playing') {
                animationId = requestAnimationFrame(gameLoop);
                return;
            }
            
            // 生成敌人
            spawnTimer += deltaTime;
            if (spawnTimer > 600 && enemies.length < 20) {
                spawnEnemy();
                spawnTimer = 0;
            }
            
            // 玩家移动 (平滑插值)
            player.x += (player.targetX - player.x) * 0.12;
            player.y += (player.targetY - player.y) * 0.12;
            
            // 边界检查
            player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
            player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));
            
            // 更新敌人
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                
                // 移动
                enemy.x += enemy.vx;
                enemy.y += enemy.vy;
                
                // 边界反弹
                if (enemy.x < -enemy.size * 2 || enemy.x > canvas.width + enemy.size * 2) {
                    enemy.vx *= -1;
                }
                if (enemy.y < -enemy.size * 2 || enemy.y > canvas.height + enemy.size * 2) {
                    enemy.vy *= -1;
                }
                
                // 碰撞检测
                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const collisionDist = player.size + enemy.size;
                
                if (dist < collisionDist) {
                    if (player.size >= enemy.size) {
                        // 吃掉！
                        score += Math.floor(enemy.size);
                        player.size += enemy.size * 0.08;
                        createParticles(enemy.x, enemy.y, enemy.color);
                        createScorePopup(enemy.x, enemy.y, Math.floor(enemy.size));
                        
                        // 更新敌人颜色（根据新大小）
                        if (enemy.size > player.size) {
                            enemy.color = '#ee5a24';
                        }
                        
                        enemies.splice(i, 1);
                    } else {
                        // 游戏结束！
                        doGameOver();
                        return;
                    }
                }
                
                // 绘制敌人
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.size, 0, Math.PI * 2);
                ctx.fillStyle = enemy.color;
                ctx.fill();
                
                // 敌人光晕
                ctx.shadowBlur = 10;
                ctx.shadowColor = enemy.color;
            }
            ctx.shadowBlur = 0;
            
            // 绘制玩家
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.shadowBlur = 20;
            ctx.shadowColor = player.color;
            ctx.shadowBlur = 0;
            
            // 更新粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            
            // 更新分数弹出
            for (let i = scorePopups.length - 1; i >= 0; i--) {
                const s = scorePopups[i];
                s.y += s.vy;
                s.life -= 0.02;
                if (s.life <= 0) {
                    scorePopups.splice(i, 1);
                    continue;
                }
                ctx.globalAlpha = s.life;
                ctx.font = 'bold 20px sans-serif';
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.fillText(s.value, s.x, s.y);
            }
            ctx.globalAlpha = 1;
            
            // 更新分数显示
            document.getElementById('score').textContent = score;
            
            animationId = requestAnimationFrame(gameLoop);
        }
        
        // 开始游戏
        function doStartGame() {
            console.log('开始游戏!');
            gameState = 'playing';
            score = 0;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.size = player.baseSize;
            player.targetX = player.x;
            player.targetY = player.y;
            enemies = [];
            particles = [];
            scorePopups = [];
            spawnTimer = 0;
            
            // 生成初始敌人
            spawnInitialEnemies();
            
            // 隐藏所有屏幕，显示HUD
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('hud').style.display = 'flex';
            
            // 确保游戏循环运行
            if (!animationId) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }
        
        // 游戏结束
        function doGameOver() {
            console.log('游戏结束!');
            gameState = 'gameover';
            
            // 更新最高分
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('blockEater_highScore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }
            
            // 显示结束画面
            document.getElementById('finalScore').textContent = '得分: ' + score;
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('hud').style.display = 'none';
        }
        
        // 鼠标/触摸控制
        canvas.addEventListener('mousemove', (e) => {
            if (gameState === 'playing') {
                player.targetX = e.clientX;
                player.targetY = e.clientY;
            }
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (gameState === 'playing') {
                player.targetX = e.touches[0].clientX;
                player.targetY = e.touches[0].clientY;
            }
        }, { passive: false });
        
        // 按钮事件
        document.getElementById('startBtn').addEventListener('click', function() {
            console.log('开始按钮点击');
            doStartGame();
        });
        
        document.getElementById('restartBtn').addEventListener('click', function() {
            console.log('再来一局按钮点击');
            doStartGame();
        });
        
        // 键盘空格键开始/重启
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (gameState === 'start' || gameState === 'gameover') {
                    doStartGame();
                }
            }
        });
        
        // 启动游戏循环
        animationId = requestAnimationFrame(gameLoop);
        
        console.log('游戏已加载完成');
    </script>
</body>
</html>
