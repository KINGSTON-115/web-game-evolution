<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方块吞噬者</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; overflow: hidden; font-family: sans-serif; }
        #gameCanvas { display: block; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(26,26,46,0.95); z-index: 10; }
        .hidden { display: none !important; }
        h1 { font-size: 48px; color: #fff; margin-bottom: 20px; }
        .btn { padding: 15px 50px; font-size: 20px; background: linear-gradient(135deg,#ff6b6b,#ee5a24); border: none; border-radius: 30px; color: #fff; cursor: pointer; margin: 10px; }
        .btn2 { background: linear-gradient(135deg,#6c5ce7,#a29bfe); }
        #hud { position: absolute; top: 15px; left: 15px; right: 15px; display: none; justify-content: space-between; pointer-events: none; z-index: 5; }
        .score { background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 10px; color: #fff; }
        .score label { color: #888; font-size: 12px; }
        .score span { font-size: 24px; font-weight: bold; }
        #timeEl { color: #4ade80; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="startScreen" class="screen">
        <h1>方块吞噬者</h1>
        <p style="color:#888;margin-bottom:30px;">吃掉绿色小球，躲避红色大球！</p>
        <button id="startBtn" class="btn">开始游戏</button>
    </div>
    
    <div id="hud">
        <div class="score"><label>分数</label><br><span id="scoreEl">0</span></div>
        <div class="score"><label>时间</label><br><span id="timeEl">0.0s</span></div>
        <div class="score"><label>最高</label><br><span id="highEl">0</span></div>
    </div>
    
    <div id="gameOverScreen" class="screen hidden">
        <h1 style="color:#ff6b6b;">游戏结束</h1>
        <p id="finalScore" style="color:#fff;font-size:24px;margin:20px 0;">得分: 0</p>
        <p id="finalTime" style="color:#888;font-size:18px;margin-bottom:20px;">存活时间: 0s</p>
        <button id="restartBtn" class="btn btn2">再来一局</button>
    </div>

    <script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        
        // 游戏变量
        let state = 'start';
        let score = 0;
        let highScore = parseInt(localStorage.getItem('bh_high')) || 0;
        let gameTime = 0; // 存活时间（秒）
        
        const player = { x: 0, y: 0, size: 20, color: '#ff6b6b', tx: 0, ty: 0 };
        let enemies = [];
        let particles = [];
        let popups = [];
        let lastTime = 0;
        let isPaused = false;
        
        // DOM 元素
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const hud = document.getElementById('hud');
        const scoreEl = document.getElementById('scoreEl');
        const timeEl = document.getElementById('timeEl');
        const highEl = document.getElementById('highEl');
        const finalScore = document.getElementById('finalScore');
        const finalTime = document.getElementById('finalTime');
        
        highEl.textContent = highScore;
        
        // 根据存活时间计算难度
        function getDifficultyMultiplier() {
            // 每10秒难度增加一级，最大3倍
            return 1 + Math.min(gameTime / 10, 2);
        }
        
        // 生成敌人 - 确保始终有能吃的
        function spawnEnemy(forceSafe) {
            let size;
            if (forceSafe || enemies.filter(e => e.size < player.size).length < 2) {
                // 强制生成比玩家小的球
                size = 10 + Math.random() * (player.size - 5);
            } else {
                // 正常随机生成
                size = 15 + Math.random() * 35 * getDifficultyMultiplier();
            }
            
            const isDangerous = size > player.size;
            
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -size : canvas.width + size;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? -size : canvas.height + size;
            }
            
            const speed = (1 + Math.random() * 2) * getDifficultyMultiplier();
            const angle = Math.random() * Math.PI * 2;
            
            enemies.push({
                x: x, y: y, size: size,
                color: isDangerous ? '#ee5a24' : '#4ade80',
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                baseSpeed: speed
            });
        }
        
        // 粒子
        function addParticles(x, y, color) {
            for (let i = 0; i < 6; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = 2 + Math.random() * 3;
                particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, size: s, color, life: 1 });
            }
        }
        
        // 分数弹出
        function addPopup(x, y, v) {
            popups.push({ x, y, v: '+' + v, life: 1, vy: -2 });
        }
        
        // 开始游戏
        function startGame() {
            state = 'playing';
            score = 0;
            gameTime = 0;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.tx = player.x;
            player.ty = player.y;
            player.size = 20;
            enemies = [];
            particles = [];
            popups = [];
            lastTime = 0;
            
            // 生成初始敌人 - 确保有能吃的
            for (let i = 0; i < 6; i++) {
                spawnEnemy(true); // 强制生成能吃的
            }
            for (let i = 0; i < 4; i++) {
                spawnEnemy(false);
            }
            
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.style.display = 'flex';
            scoreEl.textContent = '0';
            timeEl.textContent = '0.0s';
        }
        
        // 结束游戏
        function endGame() {
            state = 'gameover';
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('bh_high', highScore);
                highEl.textContent = highScore;
            }
            finalScore.textContent = '得分: ' + score;
            finalTime.textContent = '存活时间: ' + gameTime.toFixed(1) + 's';
            gameOverScreen.classList.remove('hidden');
            hud.style.display = 'none';
        }
        
        // 主循环
        function loop(time) {
            const dt = (time - lastTime) / 1000; // 转换为秒
            lastTime = time;
            
            if (state === 'playing') {
                gameTime += dt;
                timeEl.textContent = gameTime.toFixed(1) + 's';
            }
            
            // 背景
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (state === 'playing') {
                // 玩家移动
                player.x += (player.tx - player.x) * 0.12;
                player.y += (player.ty - player.y) * 0.12;
                player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
                player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));
                
                // 确保始终有能吃的球
                const edibleCount = enemies.filter(e => e.size < player.size).length;
                if (edibleCount < 3) {
                    spawnEnemy(true);
                }
                
                // 逐渐增加敌人数量
                if (enemies.length < 8 + Math.floor(gameTime / 5) && Math.random() < 0.03) {
                    spawnEnemy(false);
                }
                
                // 更新敌人
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    e.x += e.vx;
                    e.y += e.vy;
                    
                    // 反弹
                    if (e.x < -50 || e.x > canvas.width + 50) e.vx *= -1;
                    if (e.y < -50 || e.y > canvas.height + 50) e.vy *= -1;
                    
                    // 碰撞
                    const dx = player.x - e.x;
                    const dy = player.y - e.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < player.size + e.size) {
                        if (player.size >= e.size) {
                            score += Math.floor(e.size);
                            player.size += e.size * 0.08;
                            addParticles(e.x, e.y, e.color);
                            addPopup(e.x, e.y, Math.floor(e.size));
                            enemies.splice(i, 1);
                            scoreEl.textContent = score;
                        } else {
                            endGame();
                        }
                    }
                }
                
                // 绘制敌人
                enemies.forEach(e => {
                    // 根据当前玩家大小更新颜色
                    const isDangerous = e.size > player.size;
                    e.color = isDangerous ? '#ee5a24' : '#4ade80';
                    
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
                    ctx.fillStyle = e.color;
                    ctx.fill();
                });
                
                // 绘制玩家
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
                ctx.fillStyle = player.color;
                ctx.fill();
                
                // 粒子
                particles = particles.filter(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.03;
                    if (p.life <= 0) return false;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    return true;
                });
                ctx.globalAlpha = 1;
                
                // 分数弹出
                popups = popups.filter(p => {
                    p.y += p.vy;
                    p.life -= 0.02;
                    if (p.life <= 0) return false;
                    ctx.globalAlpha = p.life;
                    ctx.font = 'bold 18px sans-serif';
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.fillText(p.v, p.x, p.y);
                    return true;
                });
                ctx.globalAlpha = 1;
            }
            
            requestAnimationFrame(loop);
        }
        
        // 事件
        canvas.addEventListener('mousemove', e => {
            if (state === 'playing') {
                player.tx = e.clientX;
                player.ty = e.clientY;
            }
        });
        
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (state === 'playing') {
                player.tx = e.touches[0].clientX;
                player.ty = e.touches[0].clientY;
            }
        }, {passive: false});
        
        document.getElementById('startBtn').onclick = startGame;
        document.getElementById('restartBtn').onclick = startGame;
        
        document.addEventListener('keydown', e => {
            if (e.code === 'Space' && (state === 'start' || state === 'gameover')) {
                startGame();
            }
        });
        
        requestAnimationFrame(loop);
    })();
    </script>
</body>
</html>
