<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>方块吞噬者 - 修复版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #1a1a2e; 
            overflow: hidden; 
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: none;
        }
        #gameCanvas { 
            display: block; 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); 
        }
        #startScreen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(26, 26, 46, 0.95);
            z-index: 10;
        }
        #startScreen h1 {
            font-size: clamp(32px, 8vw, 64px);
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
        }
        #startBtn {
            margin-top: 40px;
            padding: 20px 60px;
            font-size: clamp(18px, 4vw, 24px);
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border: none;
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(255, 107, 107, 0.4);
        }
        #hud {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            z-index: 5;
        }
        .score-row { display: flex; justify-content: space-between; gap: 15px; }
        .score-box {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex: 1;
        }
        .score-label { color: #888; font-size: 14px; }
        .score-value { color: #fff; font-size: 24px; font-weight: bold; }
        #gameOverScreen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(26, 26, 46, 0.95);
            z-index: 10;
        }
        #gameOverScreen h2 { color: #ff6b6b; font-size: 48px; margin-bottom: 20px; }
        #finalScore { color: #fff; font-size: 32px; margin-bottom: 30px; }
        #restartBtn {
            padding: 15px 50px;
            font-size: 20px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border: none;
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="startScreen">
        <h1>方块吞噬者</h1>
        <p style="color:#888;margin-bottom:30px;">吃掉小方块，躲避大方块！</p>
        <button id="startBtn">▶ 开始游戏</button>
    </div>
    
    <div id="hud">
        <div class="score-row">
            <div class="score-box">
                <div class="score-label">分数</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">最高分</div>
                <div class="score-value" id="highScore">0</div>
            </div>
        </div>
    </div>
    
    <div id="gameOverScreen">
        <h2>游戏结束</h2>
        <div id="finalScore">得分: 0</div>
        <button id="restartBtn">再来一局</button>
    </div>

    <script>
        // ========== 游戏核心 ==========
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 自适应画布
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        
        // 游戏状态
        let gameState = 'start'; // start, playing, gameover
        let score = 0;
        let highScore = localStorage.getItem('blockEater_highScore') || 0;
        
        // 玩家
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 20,
            baseSize: 20,
            color: '#ff6b6b',
            targetX: canvas.width / 2,
            targetY: canvas.height / 2,
            speed: 8
        };
        
        // 敌人
        let enemies = [];
        
        // 粒子
        let particles = [];
        
        // 分数弹出
        let scorePopups = [];
        
        // 更新高分显示
        document.getElementById('highScore').textContent = highScore;
        
        // 生成敌人
        function spawnEnemy() {
            const size = 15 + Math.random() * 40;
            const isDangerous = size > player.size;
            enemies.push({
                x: Math.random() < 0.5 ? -size : canvas.width + size,
                y: Math.random() * canvas.height,
                size: size,
                color: isDangerous ? '#ee5a24' : '#4ade80',
                speed: 1 + Math.random() * 2,
                angle: Math.random() * Math.PI * 2
            });
        }
        
        // 粒子效果
        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    size: 3 + Math.random() * 5,
                    color: color,
                    life: 1
                });
            }
        }
        
        // 分数弹出
        function createScorePopup(x, y, value) {
            scorePopups.push({
                x: x, y: y,
                value: value,
                life: 1,
                vy: -2
            });
        }
        
        // 游戏循环
        let lastTime = 0;
        let spawnTimer = 0;
        
        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;
            
            // 清空画布
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制渐变背景
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (gameState === 'playing') {
                // 生成敌人
                spawnTimer += deltaTime;
                if (spawnTimer > 500) {
                    spawnEnemy();
                    spawnTimer = 0;
                }
                
                // 玩家移动 (平滑插值)
                player.x += (player.targetX - player.x) * 0.15;
                player.y += (player.targetY - player.y) * 0.15;
                
                // 边界检查
                player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
                player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));
                
                // 更新敌人
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    
                    // 朝玩家移动
                    const dx = player.x - enemy.x;
                    const dy = player.y - enemy.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist > 0) {
                        enemy.x += (dx / dist) * enemy.speed;
                        enemy.y += (dy / dist) * enemy.speed;
                    }
                    
                    // 碰撞检测
                    const collisionDist = player.size + enemy.size;
                    if (dist < collisionDist) {
                        if (player.size >= enemy.size) {
                            // 吃掉！
                            score += Math.floor(enemy.size);
                            player.size += enemy.size * 0.1;
                            createParticles(enemy.x, enemy.y, enemy.color);
                            createScorePopup(enemy.x, enemy.y, '+' + Math.floor(enemy.size));
                            enemies.splice(i, 1);
                        } else {
                            // 游戏结束！
                            gameState = 'gameover';
                        }
                    }
                    
                    // 绘制敌人
                    ctx.beginPath();
                    ctx.arc(enemy.x, enemy.y, enemy.size, 0, Math.PI * 2);
                    ctx.fillStyle = enemy.color;
                    ctx.fill();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = enemy.color;
                }
                
                // 绘制玩家
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
                ctx.fillStyle = player.color;
                ctx.fill();
                ctx.shadowBlur = 20;
                ctx.shadowColor = player.color;
                ctx.shadowBlur = 0;
                
                // 更新粒子
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.02;
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                
                // 更新分数弹出
                for (let i = scorePopups.length - 1; i >= 0; i--) {
                    const s = scorePopups[i];
                    s.y += s.vy;
                    s.life -= 0.02;
                    if (s.life <= 0) {
                        scorePopups.splice(i, 1);
                        continue;
                    }
                    ctx.globalAlpha = s.life;
                    ctx.font = 'bold 24px sans-serif';
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.fillText(s.value, s.x, s.y);
                }
                ctx.globalAlpha = 1;
                
                // 更新分数显示
                document.getElementById('score').textContent = score;
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // 开始游戏
        function startGame() {
            console.log('开始游戏!');
            gameState = 'playing';
            score = 0;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.size = player.baseSize;
            player.targetX = player.x;
            player.targetY = player.y;
            enemies = [];
            particles = [];
            scorePopups = [];
            spawnTimer = 0;
            
            // 初始生成一些敌人
            for (let i = 0; i < 10; i++) {
                spawnEnemy();
            }
            
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
        }
        
        // 游戏结束
        function gameOver() {
            gameState = 'gameover';
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('blockEater_highScore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }
            document.getElementById('finalScore').textContent = '得分: ' + score;
            document.getElementById('gameOverScreen').style.display = 'flex';
            document.getElementById('hud').style.display = 'none';
        }
        
        // 鼠标/触摸控制
        canvas.addEventListener('mousemove', (e) => {
            if (gameState === 'playing') {
                player.targetX = e.clientX;
                player.targetY = e.clientY;
            }
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (gameState === 'playing') {
                player.targetX = e.touches[0].clientX;
                player.targetY = e.touches[0].clientY;
            }
        }, { passive: false });
        
        // 按钮事件
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        
        // 启动游戏循环
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
